[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-quant-skill"
version = "0.1.0"
description = "Formulaic short-term quant trading skill for OpenClaw / MCP clients. Trades on Hyperliquid via official Python SDK."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Pocky", email = "lepockyio@gmail.com" }]
keywords = ["hyperliquid", "quant", "trading", "mcp", "openclaw", "agent", "bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "hyperliquid-python-sdk>=0.9.0",
    "eth-account>=0.10.0",
    "mcp>=1.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
hl-quant-mcp = "hyperliquid_quant.mcp_server:main"

[project.urls]
Homepage = "https://github.com/YOUR_ORG/hyperliquid-quant-skill"
Issues = "https://github.com/YOUR_ORG/hyperliquid-quant-skill/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hyperliquid_quant = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
